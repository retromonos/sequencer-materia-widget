<!DOCTYPE html>
<html>
	<head>
		<title>Sequencer Widget Engine</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<!-- STYLESHEETS -->
		<link href="//fonts.googleapis.com/css?family=Balsamiq+Sans:400,700" rel="stylesheet" type="text/css">
		<link rel="stylesheet" type="text/css" href="player.css">

		<!-- REQUIRED MATERIA JAVASCRIPT -->
		<script src="materia.enginecore.js"></script>

		<!-- YOUR PREREQUISITES -->
		<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
		<script src="//cdnjs.cloudflare.com/ajax/libs/underscore.js/1.5.2/underscore-min.js"></script>
		<script src="//cdnjs.cloudflare.com/ajax/libs/jquery.transit/0.1.3/jquery.transit.min.js"></script>

		<!-- MAIN PLAYER SCRIPT -->
		<script src="player.js"></script>
		<!-- SortableJS for drag-and-drop -->
		<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
	</head>

<body>
<div class="fade active"></div>

<!-- The child container element has to be inline. For some reason putting it on the next line breaks everything. -->
<!-- Instructions popup (Multi-page tutorial) -->
<script type="text/template" id="instructions-window"><div id="instructionsHeader">
		<div class="instructions-header">
			<h3 class="instructionsTitle">How to Play:</h3>
			<button class="instructions-close" aria-label="Close instructions">×</button>
		</div>
		<div class="instructions-content">
			<!-- Page 1: How to Play -->
			<div class="instructions-page" id="page-how-to-play">
				<div class="page-content">
					<h4>Welcome to Sequencer!</h4>
					<div class="instruction-steps">
						<div class="step">
							<div class="step-number">1</div>
							<div class="step-text">
								<strong>Drag tiles</strong> from the left panel to the sequence area on the right
							</div>
						</div>
						<div class="step">
							<div class="step-number">2</div>
							<div class="step-text">
								<strong>Reorder tiles</strong> by dragging them up and down in the sequence
							</div>
						</div>
						<div class="step">
							<div class="step-number">3</div>
							<div class="step-text">
								<strong>Click the question mark icon</strong> on any tile to view helpful clues
							</div>
						</div>
						<div class="step">
							<div class="step-number">4</div>
							<div class="step-text">
								<strong>Submit your sequence</strong> when you think you have the correct order
							</div>
						</div>
					</div>
					<div class="attempts-info">
						<p>You have <span class="attempts-highlight"><%= freeAttempts %> attempts</span> to get the correct sequence.</p>
						<p>Your highest score will be saved!</p>
					</div>
				</div>
				<div class="page-navigation">
					<button class="nav-button next-button" id="next-to-keyboard">
						Next: Keyboard Controls →
					</button>
				</div>
			</div>

			<!-- Page 2: Keyboard Instructions -->
			<div class="instructions-page hidden" id="page-keyboard">
				<div class="page-content">
					<h4>Keyboard Controls</h4>
					<div class="keyboard-instructions">
						<div class="key-group">
							<div class="key-row">
								<div class="key-button">Tab</div>
								<div class="key-description">Navigate between tiles</div>
							</div>
							<div class="key-row">
								<div class="key-button">Enter</div>
								<div class="key-description">View clue for selected tile</div>
							</div>
							<div class="key-row">
								<div class="key-button">Space</div>
								<div class="key-description">Add/remove tile from sequence</div>
							</div>
							<div class="key-row">
								<div class="key-button">Ctrl+R</div>
								<div class="key-description">Reset entire sequence</div>
							</div>
						</div>
						<div class="key-group">
							<div class="key-row">
								<div class="key-button">→</div>
								<div class="key-description">Add tile to sequence</div>
							</div>
							<div class="key-row">
								<div class="key-button">←</div>
								<div class="key-description">Remove tile from sequence</div>
							</div>
							<div class="key-row">
								<div class="key-button">↑</div>
								<div class="key-description">Move tile up in sequence</div>
							</div>
							<div class="key-row">
								<div class="key-button">↓</div>
								<div class="key-description">Move tile down in sequence</div>
							</div>
							<div class="key-row">
								<div class="key-button">Ctrl+V</div>
								<div class="key-description">Toggle between pile and list view</div>
							</div>
						</div>
					</div>
					<div class="accessibility-note">
						<p><strong>Accessibility:</strong> All features are fully accessible via keyboard navigation and screen readers.</p>
					</div>
				</div>
				<div class="page-navigation">
					<button class="nav-button prev-button" id="prev-to-how-to-play">
						← Back to How to Play
					</button>
					<button class="nav-button start-button" id="start-game">
						Start Game
					</button>
				</div>
			</div>
		</div>
	</div>
</script>

<script type="text/template" id="t-board"><div class="board" inert="true">
		<!-- Top Header -->
		<header class="top-header">
			<div class="header-left">
				<h1 class="app-title"><%= title %></h1>
			</div>
			<div class="header-right">
				<div class="score-display">
					<span>best score: <span id="score"><%= score %></span></span>
				</div>
				<button id="help-button" class="help-button" aria-label="Show instructions" tabindex="0">
					?
				</button>
			</div>
		</header>

		<!-- Main Content Area -->
		<main class="main-content">
			<!-- Left Section -->
			<section class="left-section">
				<!-- Controls -->
				<div class="controls-bar">
					<div class="attempts-info">
						<span id="practiceMode-info" class="control-pill">(Practice Mode)</span>
						<span id="attempts-info" class="control-pill">
							<span id="attemptsLeft"><%= freeAttempts %></span> guesses left
						</span>
					</div>
					<button class="list-view-btn control-pill">
						≡ List view
					</button>
				</div>

				<!-- Tile Section -->
				<div id="tileSection" class="tile-section">
					<div id="dragContainer" role="list" class="drag-container">
						<!-- tiles -->
						<% for(var t in tiles) { var tile = tiles[t]; %>
							<div class="tile"
								data-id="<%= tile.id %>"
								id="<%= tile.id %>"
								tabindex=0
								role="listitem"
								aria-label="<%= tile.name %> - position to be determined">
								<div class="tile-icon" data-id="<%= tile.id %>">
									<span class="question-mark">?</span>
								</div>
								<div class="tile-content">
									<%= tile.name %>
								</div>
							</div>
						<% } %>
					</div>
				</div>
			</section>

			<!-- Right Section -->
			<section class="right-section">
				<div class="sequence-container">
					<div id="orderInstructions" class="order-instructions">
						Drag tiles here to sequence them
					</div>
					<!-- Order Area -->
					<div id="orderArea" class="order-area" role="list" aria-label="Sequence area - drag tiles here to order them">
						
					</div>
				</div>

				<!-- Submit Button -->
				<div class="submit-container">
					<button id="submit"
						class="submit-button"
						tabindex=0
						disabled>
						Submit Sequence
					</button>
				</div>
			</section>
		</main>

		<button id="wraparound"
			class="visible-on-focus"
			tabindex=0
			aria-label='Press Space or Enter to select the first unsorted tile.'>
			Select First Unsorted Item
		</button>
	</div>
</script>

<!-- clues -->
<script type="text/template" id="tile-clue-window"><div id="clueHeader">
		<div class="clue-header">
			<h3 class="clueTitle"><%= name %></h3>
			<button class="clue-close" aria-label="Close clue">×</button>
		</div>
		<aside role="definition" class="tile-clue-text" aria-live="polite">
			<p class="clueDescription"><%= clue %></p>
		</aside>
	</div>
</script>


<script type="text/template" id="drop-zone"><div class="drop-zone" data-position="<%= position %>">
	</div>
</script>

<!-- message window (Finished) -->
<script type="text/template" id="message-window"><div class="submit-sequence-popup" id="submitSequencePopup">
		<div class="popup-content">
			<div class="submit-header">
				<h3 class="submitTitle"><%= title %></h3>
				<button class="submit-close" aria-label="Close submit sequence popup">×</button>
			</div>
			<div class="submit-content">
				<p><%= messageText %></p>
				<button class="okay-button" id="okayButton" tabindex="0">
					Okay
				</button>
			</div>
		</div>
	</div>
</script>

<!-- score results -->
<script type="text/template" id="results-popup"><div id="resultsHeader">
		<div class="results-header">
			<h3 class="resultsTitle">Sequence Results</h3>
			<button class="results-close" aria-label="Close results">×</button>
		</div>
		<div class="results-content">
			<!-- Score Summary -->
			<div class="score-summary">
				<div class="score-circle">
					<div class="score-number"><%= Math.round((correct / total) * 100) %>%</div>
					<!-- <div class="score-label">Current Score</div> -->
				</div>
				<div class="score-details">
					<div class="correct-items">
						<span class="correct-number"><%= correct %></span>
						<span class="correct-label">out of <span class="total-items"><%= total %></span> items in the right spot</span>
					</div>
					<div class="best-score" id="bestScoreDisplay">
						Best score so far: <span class="best-score-number"><%= highestScore %>%</span>
					</div>
				</div>
			</div>

			

			<!-- Action Buttons -->
			<div class="results-actions">
				<% if (correct === total) { %>
					<!-- Perfect Score -->
					<div class="perfect-score-message">
						<span class="perfect-text">Perfect! All items in correct order!</span>
					</div>
					<button id="submitScoreButton" class="action-button secondary-button" aria-label="Visit score screen">
						Visit Score Screen
					</button>
				<% } else if (freeAttempts > 0 || practiceMode) { %>

					<!-- Attempts Info - hide for perfect scores -->
					<div class="row">
					<% if (correct !== total) { %>
						<div class="attempts-status">
							<% if (freeAttempts > 0 || practiceMode) { %>
								<div class="attempts-remaining">
									<% if (practiceMode) { %>
										<span class="attempts-icon">∞</span>
										<span class="attempts-text">Unlimited attempts (Practice Mode)</span>
									<% } else { %>
										<span class="attempts-icon"><%= freeAttempts %></span>
										<span class="attempts-text"><%= freeAttempts === 1 ? 'attempt' : 'attempts' %> remaining</span>
									<% } %>
								</div>
							<% } else { %>
								<div class="attempts-exhausted">
									<span class="attempts-icon">⚠</span>
									<span class="attempts-text">No attempts remaining</span>
								</div>
							<% } %>
						</div>
					<% } %>
					<!-- Can Try Again -->
					<button id="resultsButton" class="action-button primary-button" aria-label="Try again">
						Try Again
						<!-- <% if (!practiceMode) { %>
							<span class="attempts-count">(<%= freeAttempts %> <%= freeAttempts === 1 ? 'attempt' : 'attempts' %> left)</span>
						<% } %> -->
					</button>
					</div>
					<button id="submitScoreButton" class="action-button secondary-button" aria-label="Finish with best score of <%= highestScore %>%">
						Finish with Best Score (<%= highestScore %>%)
					</button>
				<% } else { %>
					<!-- No More Attempts -->
					<button id="resultsButton" class="action-button primary-button" aria-label="Visit score screen">
						Visit Score Screen
					</button>
				<% } %>
			</div>
		</div>
	</div>
</script>

<div role="status" class="ariaLiveStatus" aria-live="polite"></div>

<!-- screen reader element for position announcements -->
<div class="sr-only" aria-live="polite" id="positionAnnouncer"></div>

<div class="confirmDialog" inert="true">
	<p>
		Are you sure you want to stop with your best score of <span class="bestscore bold"></span>?
	</p>
	<button id="cancelBestScoreButton" class="resultsButton">No, keep trying</button>
	<button id="confirmBestScoreButton" class="resultsButton">Yes, finish with <span class="bestscore"></span>.</button>
</div>

<!-- INITIALIZE -->
	<script>
		Materia.Engine.start(Sequencer.Engine);
	</script>

	</body>
</html>
